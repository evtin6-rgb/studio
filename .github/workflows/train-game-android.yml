name: Чух-Чух! Android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['train-game/**', '.github/workflows/train-game-android.yml']
  pull_request:
    paths: ['train-game/**', '.github/workflows/train-game-android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Загрузить AAB в Google Play'
        type: boolean
        default: false
      track:
        description: 'Трек Google Play'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Статус релиза (draft — пока приложение не прошло первую проверку)'
        type: choice
        options: [draft, completed]
        default: draft

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: train-game/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Секрет KEYSTORE_BASE64 не задан — release-сборка будет неподписанной"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: chuhchuh-${{ github.run_number }}
          path: |
            train-game/android/app/build/outputs/apk/debug/*.apk
            train-game/android/app/build/outputs/bundle/release/*.aab

      - name: Загрузка в Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: studio.evtin.chuhchuh
          releaseFiles: train-game/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          inAppUpdatePriority: 0
